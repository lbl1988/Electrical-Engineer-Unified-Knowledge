site_name: 电气工程全域知识库
docs_dir: docs
site_dir: _site
site_url: https://kb-static-8zpj.onrender.com
repo_url: https://github.com/lbl1988/Registered-Electrical-Engineer-Unified-Knowledge-Base
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: 切换暗色
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切换亮色

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.mark
  - toc:
      permalink: true
  - attr_list
  - md_in_html

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search:
      lang:
        - ja
        - en

nav:
  - 首页: README.md
  - 全站检索: 搜索.md
  - 元数据层: 00-meta/README.md
  - 基础理论: 10-theory/README.md
  - 标准规范: 20-standards/README.md
  - 工程实践: 30-practice/README.md
  - 计算方法: 40-calc/README.md
  - 工程案例: 50-case/README.md
  - 考纲目录: 60-exam/README.md
  - 治理: 90-governance/README.md
